# Declarative Automation Bundle configuration, more info here: https://docs.databricks.com/en/dev-tools/bundles/settings.html
bundle:
  name: "lending-bundle"

include:
  - resources/*.yml
  - resources/*/*.yml

variables:
  catalogo:    {default: lending}
  esquema:     {default: datalab_zone}
  ruta_origen: {default: /Volumes/lending/landing_zone/archivos/lending}

targets:
  # The 'dev' target, for development purposes. This target is the default.
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-dfb14324-e95d.cloud.databricks.com

  # The 'prod' target, used for production deployment.
  prod:
    mode: production
    workspace:
      host: https://dbc-dfb14324-e95d.cloud.databricks.com
      # We always use /Users/daniel.epr77@gmail.com for all resources to make sure we only have a single copy.
      root_path: /Users/daniel.epr77@gmail.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # This runs as daniel.epr77@gmail.com in production. We could also use a service principal here,
      # see https://docs.databricks.com/dev-tools/bundles/permissions.html.
      user_name: daniel.epr77@gmail.com
