[project]
name = "lending_bronze"
version = "0.0.1"
authors = [{ name = "daniel.epr77@gmail.com" }]
requires-python = ">=3.12,<3.13"
# Sin dependencias de runtime: en el job, serverless ya trae pyspark.
# El código se despliega como archivos (src/main.py + src/ingesta_lending/), no como wheel.
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
